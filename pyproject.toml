[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "turkic-translit"
version = "0.3.9"
description = "Deterministic Latin and IPA transliteration for Kazakh, Kyrgyz, Uzbek, Turkish, Azerbaijani, Uyghur, Finnish, plus tokenizer/glue scripts."
authors = [ {name="Austin Wagner", email="austinwagner@msn.com"} ]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["kazakh", "kyrgyz", "transliteration", "ipa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    # Core dependencies (alphabetized)
    "epitran>=1.0,<1.27",           # 1.26.0 is the latest on PyPI
    # Universal fasttext-wheel for all platforms and Python 3.10-3.13
    "fasttext-wheel==0.9.2",
    "numpy<2",
    "packaging>=23.0",              # Used in tests/test_fasttext.py
    "panphon>=0.20,<0.22",          # 0.21.2 is the newest published wheel
    # PyICU is required, but Windows users must install the correct wheel manually. See README and turkic-pyicu-install for help.
    # PyICU wheels: pre-built for Windows versions, fallback to PyPI elsewhere

    "PyICU>=2.13,<2.16; sys_platform != 'win32'",
    "pytest>=8.0",                  # Test runner
    "PyYAML>=6.0",                  # Reads the corpus source registry at import
    "rapidfuzz>=3.5",
    "rich>=13.7",                   # Color-aware logging and console output
    "python-json-logger>=2.0.4",    # Structured JSON logging
    "sentencepiece>=0.2.0",
    "click>=8.1",
    "datasets (>=3.6.0,<4.0.0)",
    "evaluate>=0.4",             # PPL metric
    "accelerate>=0.28",          # HF Trainer device dispatch
    "transformers>=4.41,<5",        # mGPT / BLOOM causal LM
    "tqdm>=4.66",                # progress bars for LM utilities
    "scikit-learn>=1.4",        # cosine similarity utilities
    "typing_extensions>=4.12",    # for Never on Python ≤3.11
    "wikipedia (>=1.4.0,<2.0.0)",
    # UI dependencies
    "gradio>=4.0",
    "pandas",
    "matplotlib>=3.9",           # cosine-similarity heat-map
    "pycountry>=23.12",          # ISO language names for pretty dropdown labels
    "zstandard>=0.23",
]

[project.optional-dependencies]
examples = [
    "flask",
    "streamlit",
    "jupyterlab",
]
winlid = []
corpus = [
    "datasets>=3.0",
    "pyarrow>=14.0",
]
sentry = [
    "sentry-sdk>=2.0",
]

# Development tools
dev = [
    "ruff>=0.2.0",         # Fast linter
    "mypy>=1.0",           # Type checker
    "pytest>=8.0",         # Testing framework
    "pytest-cov>=4.1",     # Statement + branch coverage
    "pytest-xdist>=3.6",   # Parallel test execution
    "pytest-timeout>=2.3", # Per-test deadline
    "build>=1.0",          # Package builder
    "twine>=4.0",          # Package uploader
    "make>=0.1.6",         # Make command for Windows
    "types-PyYAML>=6.0",   # Type stubs for the corpus source registry loader
]

[project.scripts]
turkic-translit = "turkic_translit.cli:main"
turkic-pyicu-install = "turkic_translit.pyicu_install:main"
turkic-filter-russian = "turkic_translit.cli.filter_russian:main"
turkic-download-corpus = "turkic_translit.cli.download_corpus:cli"
turkic-build-spm = "turkic_translit.cli.build_spm:main"
turkic-leven = "turkic_translit.cli.run_leven:main"
turkic-web = "turkic_translit.web.web_demo:main"
turkic-train-lm = "turkic_translit.cli.train_lm:cli"
turkic-eval-lm  = "turkic_translit.cli.eval_lm:cli"
turkic-train-spm = "turkic_translit.cli.train_spm:main"


[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"turkic_translit" = ["py.typed", "rules/*.rules"]
"turkic_translit.corpus" = ["corpora.yaml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

# Third-party libraries that ship no stubs and no py.typed marker. Scoped
# per module rather than blanket-disabled, so a newly-untyped import fails
# the build instead of being silently absorbed. No `# type: ignore` is used
# anywhere in the tree; this is the config-level equivalent, narrowed to the
# exact modules that lack type information upstream.
[[tool.mypy.overrides]]
module = ["icu", "icu.*", "fasttext", "fasttext.*", "sentencepiece", "datasets", "datasets.*", "sentry_sdk", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]
exclude = [".venv", "vendor", "dist", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "N", "C4", "SIM", "RET", "C90", "RUF", "ANN", "PT", "PIE"]
ignore = ["E501"]
# IPA transcription project: these phonetic symbols are intentional content,
# not lookalike typos (RUF001/RUF002/RUF003).
allowed-confusables = ["ɑ", "ɯ", "ɪ", "ʊ", "ʔ", "ː", "’", "–", "ʋ", "ɡ", "ɣ"]
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use typing.TypeAlias; declare the type directly." }

[tool.ruff.lint.isort]
known-first-party = ["turkic_translit", "scripts"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["src", "scripts"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
markers = ["network: tests that hit external sites"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
