[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "turkic-translit"
version = "0.5.8"
description = "Deterministic Latin and IPA transliteration for Kazakh, Kyrgyz, Uzbek, Turkish, Azerbaijani, Uyghur, Finnish, plus tokenizer/glue scripts."
authors = [ {name="Austin Wagner", email="austinwagner@msn.com"} ]
# 3.10 is the floor pyicu-wheels publishes for, and the floor the
# classifiers below advertise. Declaring 3.9 promised an install that
# could not have worked, since no ICU extension is built for one.
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = ["kazakh", "kyrgyz", "transliteration", "ipa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    # Every entry below is either imported by src/ or required at runtime by
    # something that is. Anything else belongs in [dev] or nowhere: an
    # undeclared import and an unused declaration are the same bug seen from
    # opposite sides, and both were present here.
    "click>=8.1",
    # Universal fasttext-wheel for all platforms and Python 3.10-3.13. It is
    # the only build with Windows wheels; the numpy-2 forks publish none, so
    # swapping the dependency would cost every Windows user a C++ toolchain.
    # Its Python wrapper's predict() ends in np.array(probs, copy=False),
    # which NumPy 2 rejects, and that single line is why this project pinned
    # numpy<2. Nothing here calls that wrapper any more: the LID adapter goes
    # straight to the native predictor, which returns plain tuples.
    "fasttext-wheel==0.9.2",
    # 6.0 or newer for two reasons. Its gradio_client reaches websockets
    # through `websockets.asyncio` rather than `websockets.legacy`, which
    # has warned on import since websockets 14. And 5.x warns about three
    # parameters it removes in 6.0 — the Blocks theme, a Textbox's copy
    # button, and an event listener's show_api — while providing none of
    # the replacements, so no code written against 5.x can be free of
    # those warnings. Both are what stopped this project from treating a
    # warning as an error.
    "gradio>=6.0,<7",
    "numpy>=1.26",
    "pandas",
    # PyICU produces every transliteration and every IPA string: to_ipa and
    # to_latin compile rules/<lang>_ipa.rules through it.
    #
    # Taken as pyicu-wheels rather than as PyICU because PyICU publishes
    # no wheels at all — sdist only, every platform — so installing it
    # means compiling against ICU headers the machine probably lacks.
    # That is why this project shipped a Windows wheel installer and two
    # troubleshooting guides, and why `pip install turkic-translit`
    # produced something that could not transliterate on any operating
    # system. pyicu-wheels publishes the same extension, same import
    # name, for manylinux, musllinux, macOS and Windows.
    "pyicu-wheels==2.15.2",
    "pycountry>=23.12",             # ISO language names for dropdown labels
    # 3.1 is the first release with the pythonjsonlogger.json module this
    # imports; the older pythonjsonlogger.jsonlogger path is not typed.
    "python-json-logger>=3.1",
    "PyYAML>=6.0",                  # reads the corpus source registry at import
    "rapidfuzz>=3.5",
    "rich>=13.7",                   # colour-aware logging and console output
    "sentencepiece>=0.2.0",
    # pandas ships tabulate only under its output-formatting extra, and
    # web_utils.token_table_markdown calls DataFrame.to_markdown directly.
    "tabulate>=0.9",
    # Imported unconditionally by lm/similarity.py and lm/train.py, which
    # turkic_translit.cli imports at startup, so the console script does
    # not run without it. transformers declares torch only under an
    # extra, so it was reaching this project by luck.
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=5.0,<6",         # mGPT / BLOOM causal LM
    # Not imported anywhere, and required anyway: transformers.Trainer, used
    # by lm/train.py, raises at construction without it.
    "accelerate>=0.28",
    # OSCAR-2301 ships .jsonl.zst shards and corpus/_test_hooks.py
    # decompresses them as they stream. It was undeclared for one
    # release, during which the demo raised ModuleNotFoundError before
    # it could serve a page: the corpus tab reached zstandard through
    # the dataset's loading script, so no import statement here named
    # it and the dependency audit dropped it. The driver imports it
    # outright now, and the script is gone.
    "zstandard>=0.23",
]

[project.optional-dependencies]
examples = [
    "flask",
    "streamlit",
    "jupyterlab",
]
sentry = [
    "sentry-sdk>=2.0",
]

# Development tools
dev = [
    "ruff>=0.2.0",         # Fast linter
    "mypy>=1.0",           # Type checker
    "pytest>=8.0",         # Testing framework
    "pytest-cov>=4.1",     # Statement + branch coverage
    "pytest-xdist>=3.6",   # Parallel test execution
    "pytest-timeout>=2.3", # Per-test deadline
    "build>=1.0",          # Package builder
    "twine>=4.0",          # Package uploader
    "make>=0.1.6",         # Make command for Windows
    "types-PyYAML>=6.0",   # Type stubs for the corpus source registry loader
    "pandas-stubs>=2.0",   # Type stubs for the web UI's token table
    "types-tqdm>=4.66",    # Type stubs for the corpus and encoding progress bars
    # scripts/hf_space.py compares the Gradio SDK the Space installs
    # against the requirement declared above. Both sides are PEP 440,
    # and this is the library that reads PEP 440 correctly.
    "packaging>=23.0",
    # 0.21.x imports pkg_resources, which setuptools 81 removed, so the
    # module cannot be imported at all below 0.22.
    "panphon>=0.22,<0.23",  # Phonological features; only tests/test_verification.py
    # The optional error-reporting backend. Declared here as well as in
    # [sentry] so the reporter that production binds is exercised for
    # real rather than only through the protocol it satisfies.
    "sentry-sdk>=2.0",
    # transformers reads a SentencePiece-backed tokenizer's model through
    # protobuf. Only tests/tiny_model.py builds one, for the language-model
    # tests; the shared-vocabulary override it used to serve is gone.
    "protobuf>=4.0",
]

[project.scripts]
turkic-translit = "turkic_translit.cli:main"
turkic-filter-russian = "turkic_translit.cli.filter_russian:main"
turkic-download-corpus = "turkic_translit.cli.download_corpus:cli"
turkic-clean-corpus = "turkic_translit.cli.clean_corpus:cli"
turkic-build-spm = "turkic_translit.cli.build_spm:main"
turkic-leven = "turkic_translit.cli.run_leven:main"
turkic-train-lm = "turkic_translit.cli.train_lm:cli"
turkic-eval-lm  = "turkic_translit.cli.eval_lm:cli"
turkic-train-spm = "turkic_translit.cli.train_spm:main"


[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"turkic_translit" = ["py.typed", "rules/*.rules"]
"turkic_translit.corpus" = ["corpora.yaml", "symbol_map.csv", "folds.csv"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

# There are no [[tool.mypy.overrides]] blocks, and there will not be one.
# A library that ships no stubs is reached through __import__ and bound to
# a Protocol that states the part of it this project uses; a library whose
# public API is unannotated is reached the same way. Both are in
# _test_hooks modules, so the untyped surface stops at a named boundary
# instead of being absorbed by configuration nobody reads.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
exclude = [".venv", "vendor", "dist", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "N", "C4", "SIM", "RET", "C90", "RUF", "ANN", "PT", "PIE"]
ignore = ["E501"]
# This project transliterates between Cyrillic, Latin, Arabic and IPA, so
# the characters below are its subject matter rather than lookalike typos
# (RUF001/RUF002/RUF003). It cannot write its own rule tables, test
# fixtures or character classes without them. Anything NOT listed here is
# still flagged, which is what caught a SIX-PER-EM SPACE standing in for a
# space in the pad-token fallback in lm/train.py.
allowed-confusables = [
    # IPA
    "ɑ", "ɯ", "ɪ", "ʊ", "ʔ", "ː", "’", "–", "ʋ", "ɡ", "ɣ", "ʏ",
    # Cyrillic letters that are homoglyphs of Latin ones
    "А", "а", "В", "Е", "е", "К", "М", "Н", "О", "о",
    "Р", "р", "С", "с", "Т", "У", "у", "Х", "х", "І", "і",
    "Ј", "Ѕ", "ѕ", "һ", "ґ", "ғ", "б", "г", "з", "п", "ч", "ү",
    # Turkish and Azerbaijani dotless i, and the Uzbek modifier apostrophes
    # in both codepoints web text spells them with. The left quotation
    # mark and the right half ring join them because the apostrophe
    # character class the rules match spells all of these, and a test
    # that states that class has to be able to write it out.
    "ı", "ʻ", "ʼ", "‘", "ʾ",
    # Guillemets, the linguistic convention for citing an orthographic form
    "‹", "›",
    # Greek gamma as Ragagnin's Turcological transcription prints it
    "γ",
    # IPA primary-stress mark as Karlsson's printed forms carry it
    "ˈ",
    # Arabic-script letters used by the Uyghur rules
    "ا", "ھ", "ە",
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use typing.TypeAlias; declare the type directly." }

[tool.ruff.lint.isort]
known-first-party = ["turkic_translit", "scripts"]

# There are no [tool.ruff.lint.per-file-ignores], and there will not be
# one. A re-export is spelled `from x import y as y` so it is a re-export
# rather than an unused import, and a Protocol never spells a foreign
# binding's method name: the bound method is taken with getattr and
# annotated as a callable Protocol, which needs no name of its own.

[tool.coverage.run]
source = ["src", "scripts"]
branch = true
# Child processes write their own data file and are combined in. Needed
# because several tests spawn the real console scripts, and measuring
# only the parent would report that code as untested.
parallel = true
sigterm = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
markers = ["network: tests that hit external sites"]
# A warning fails the run. The previous setting ignored every
# DeprecationWarning in the tree, which hid this project's own
# deprecations along with its dependencies' — and it was hiding three
# real ones, all now fixed: gradio's theme and stylesheet moved from the
# Blocks constructor to launch(), and a Textbox's copy button became an
# entry in `buttons`.
#
# Four lines follow `error`, covering two upstream defects that cannot
# be fixed here.
#
# Building a Gradio interface leaves an asyncio event loop unclosed, and
# on Windows that loop's self-pipe is a socket pair. The loop belongs to
# Gradio and lives as long as the interface does. ResourceWarning is
# silenced as a category rather than by message because it is raised by
# the garbage collector, so it lands in whichever test happens to
# trigger a collection — a leak in one module failed an unrelated ICU
# test. pytest re-raises the same event as its own unraisable warning,
# which is why both appear.
#
# Serving an interface makes uvicorn drive websockets through its pre-14
# API, which warns on import and again per connection. These two are
# scoped to the modules that raise them rather than to a message,
# because the set of messages is upstream's to change. They must be
# ignored rather than merely tolerated: raised inside the server thread,
# an error kills that thread, so the server never binds and every test
# that serves fails with a misleading "cannot find empty port". Turning
# a warning into an error changes what third-party threads do, which is
# the one place this setting cannot be applied blindly.
#
# Every other warning still fails, including any raised by this project.
# DeprecationWarning outside those two modules is what this setting is
# for, and it is what caught the three Gradio 6 changes fixed above.
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:uvicorn.*",
]
