name: Publish to PyPI

# One push releases everything. Bump the version in pyproject.toml,
# commit, and:
#
#     git push
#
# That is the whole procedure. This workflow publishes the version
# pyproject declares if PyPI does not have it yet, and tags the commit
# it published; sync-to-hf-space, triggered by the same push, waits for
# that version to appear on PyPI and then rebuilds the demo on it.
#
# The tag is made here rather than by hand because a tag typed
# separately is a second chance to get the release wrong: pushed without
# the commit it names, forgotten entirely, or naming a version PyPI
# never received. The workflow tags what it actually published.
#
# Publishing is skipped, not failed, when PyPI already has the version.
# A push that changes only source or workflows is the ordinary case, and
# it means the demo rebuilds on the release it already has.
#
# One-time setup on pypi.org (manage project turkic-translit ->
# Publishing -> Add a new publisher -> GitHub):
#   owner: wagner-austin
#   repository: turkic_transliteration
#   workflow name: release.yml
#   environment name: pypi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI trusts instead of a password
      contents: write # to push the tag naming what was published
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version from pyproject.toml
        id: version
        run: |
          python -m pip install --upgrade packaging
          VERSION="$(python -m scripts.hf_space --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject declares $VERSION"

      - name: Ask PyPI whether it already has that version
        id: published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/turkic-translit/$VERSION/json")
          if [ "$status" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "PyPI already has $VERSION; nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "PyPI answered $status for $VERSION; publishing it."
          fi

      - name: Build sdist and wheel
        if: steps.published.outputs.already == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.published.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      # After publishing, so the tag names a version PyPI accepted
      # rather than one an upload might still have failed on.
      - name: Tag the commit that was published
        if: steps.published.outputs.already == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Tagged v$VERSION."
