name: Sync to Hugging Face Space

# One push to main updates the demo, and nothing on huggingface.co is
# ever edited by hand. The Space's card, its entry point and its pinned
# requirement are all written from this repository by
# ``scripts/hf_space.py``, so the two copies cannot drift.
#
# They drifted once and it cost the demo a day. The Space's card still
# declared ``sdk_version: 5.29.0`` after the package moved its Gradio
# floor to 6.0, and a Space build installs the SDK named on its card
# alongside the packages in requirements.txt, so pip was handed
# ``gradio==5.29.0`` and ``gradio>=6.0`` in one resolution and refused
# both. Neither file was wrong on its own, which is why the pair is
# what ``tests/test_hf_space.py`` asserts and what the renderer refuses
# to publish when it does not hold.
#
# The job then waits for the build it triggered and fails when that
# build fails. The version before this one pushed and reported success
# without looking, so a Space that could not install looked exactly
# like a Space that could.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.py'
      - 'pyproject.toml'
      - '.github/hf-space/**'
      - 'scripts/hf_space.py'
      - '.github/workflows/sync-to-hf-space.yml'
  workflow_dispatch:

env:
  SPACE_NAME: turkic-transliteration-demo

jobs:
  sync-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the renderer's one dependency
        run: python -m pip install --upgrade packaging

      - name: Read the version from pyproject.toml
        id: version
        run: |
          VERSION="$(python -m scripts.hf_space --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Wait for PyPI to publish the new version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://pypi.org/pypi/turkic-translit/$VERSION/json")
            if [ "$status" = "200" ]; then
              echo "PyPI has turkic-translit==$VERSION available."
              exit 0
            fi
            echo "Attempt $attempt/30: PyPI has not yet published $VERSION (HTTP $status). Retrying in 20s."
            sleep 20
          done
          echo "ERROR: turkic-translit==$VERSION was not visible on PyPI after 10 minutes." >&2
          exit 1

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git clone "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME" hf-space
          cd hf-space
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Refuses to write anything when the card's SDK falls outside the
      # package's Gradio requirement, so the resolution that broke the
      # build cannot be pushed even if the tests were never run.
      - name: Render the Space from this repository
        run: python -m scripts.hf_space --space hf-space

      # What the Space reports now, so the wait below can tell the build
      # this push triggers from the one that preceded it.
      - name: Note the stage the Space is in before the push
        id: before
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          stage="$(curl -sf "https://huggingface.co/api/spaces/$HF_USERNAME/$SPACE_NAME/runtime" \
            | python -c 'import json,sys; print(json.load(sys.stdin).get("stage",""))' || true)"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "The Space is currently $stage."

      - name: Commit and push
        working-directory: hf-space
        run: |
          git add README.md requirements.txt app.py
          if git diff --cached --quiet; then
            echo "The rendered files match what the Space already holds; forcing a rebuild."
            git commit --allow-empty -m "Rebuild on turkic-translit==${{ steps.version.outputs.version }}"
          else
            git commit -m "Sync: turkic-translit==${{ steps.version.outputs.version }}"
          fi
          git push origin main

      - name: Wait for the Space to build
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          PREVIOUS_STAGE: ${{ steps.before.outputs.stage }}
        run: |
          API="https://huggingface.co/api/spaces/$HF_USERNAME/$SPACE_NAME/runtime"
          attempts=160
          settled=0

          for attempt in $(seq 1 $attempts); do
            runtime="$(curl -sf "$API" || true)"
            stage="$(printf '%s' "$runtime" \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("stage",""))' || true)"

            case "$stage" in
              BUILDING|APP_STARTING|RUNNING_BUILDING|RUNNING_APP_STARTING)
                # The build this push triggered has started, so whatever
                # the Space settles on next is this run's result.
                settled=1
                echo "Attempt $attempt/$attempts: $stage."
                ;;
              RUNNING|SLEEPING|PAUSED)
                if [ "$settled" = "1" ] || [ "$stage" != "$PREVIOUS_STAGE" ]; then
                  echo "The Space is $stage: https://huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME"
                  exit 0
                fi
                echo "Attempt $attempt/$attempts: still $stage from before the push."
                ;;
              BUILD_ERROR|CONFIG_ERROR|RUNTIME_ERROR|NO_APP_FILE)
                if [ "$settled" = "1" ] || [ "$stage" != "$PREVIOUS_STAGE" ]; then
                  echo "::error::The Space is $stage after this push."
                  printf '%s' "$runtime" \
                    | python -c 'import json,sys; print(json.load(sys.stdin).get("errorMessage",""))' \
                    || true
                  exit 1
                fi
                echo "Attempt $attempt/$attempts: still $stage from before the push."
                ;;
              *)
                echo "Attempt $attempt/$attempts: stage reported as '$stage'."
                ;;
            esac
            sleep 15
          done

          echo "::error::The Space had not settled 40 minutes after the push; last stage '$stage'."
          exit 1
